workflows:
  ios-workflow:
    name: Wafar iOS
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_api_key   # اسم الـ integration اللي عملته في الـ UI
    environment:
      flutter: 3.44.3
      xcode: latest
      cocoapods: 1.16.2
      ios_signing:
        distribution_type: app_store   # أو ad_hoc لو التوزيع مش عن طريق الـ App Store
        bundle_identifier: com.wafar.user
    scripts:
      # ... باقي السكريبتات زي ما هي ...
      - name: Set up code signing profiles
        script: |
          xcode-project use-profiles
