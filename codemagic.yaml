workflows:
  ios-workflow:
    name: Wafar iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Wafar Codemagic

    environment:
      flutter: "3.44.3"
      xcode: "latest"
      cocoapods: "1.16.2"

      vars:
        BUNDLE_ID: "com.wafar.user"
        COMPILER_INDEX_STORE_ENABLE: "NO"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.wafar.user

    scripts:

      # =====================================================
      # 1. Disable Swift Package Manager
      # =====================================================
      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager

      # =====================================================
      # 2. Clean Flutter
      # =====================================================
      - name: Clean Flutter
        script: |
          flutter clean

      # =====================================================
      # 3. Remove old iOS and SwiftPM data
      # =====================================================
      - name: Remove old iOS and SwiftPM data
        script: |
          rm -rf ios/.symlinks
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/Runner.xcworkspace

          find ios -name "Package.resolved" -type f -delete

          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ~/Library/Caches/org.swift.swiftpm/*
          rm -rf ~/Library/org.swift.swiftpm/*

      # =====================================================
      # 4. Generate GoogleService-Info.plist
      # =====================================================
      - name: Generate GoogleService-Info.plist
        script: |
          mkdir -p ios/Runner

          cat << 'EOF' > ios/Runner/GoogleService-Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>API_KEY</key>
              <string>AIzaSyDyKV_vH04kjoCZHaVpXOI1AA-KEDr405Y</string>

              <key>GCM_SENDER_ID</key>
              <string>730828848463</string>

              <key>PLIST_VERSION</key>
              <string>1</string>

              <key>BUNDLE_ID</key>
              <string>com.wafar.user</string>

              <key>PROJECT_ID</key>
              <string>wafar-ccf7b</string>

              <key>STORAGE_BUCKET</key>
              <string>wafar-ccf7b.firebasestorage.app</string>

              <key>IS_ADS_ENABLED</key>
              <false/>

              <key>IS_ANALYTICS_ENABLED</key>
              <false/>

              <key>IS_APPINVITE_ENABLED</key>
              <true/>

              <key>IS_GCM_ENABLED</key>
              <true/>

              <key>IS_SIGNIN_ENABLED</key>
              <true/>

              <key>GOOGLE_APP_ID</key>
              <string>1:730828848463:ios:3761c4afa6e87da5f5593a</string>
          </dict>
          </plist>
          EOF

          cp ios/Runner/GoogleService-Info.plist ios/GoogleService-Info.plist

      # =====================================================
      # 5. Get Flutter dependencies
      # =====================================================
      - name: Get Flutter dependencies
        script: |
          flutter pub get

      # =====================================================
      # 6. Install CocoaPods
      # =====================================================
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

      # =====================================================
      # 7. Configure App Store signing
      # =====================================================
      - name: Set up App Store code signing
        script: |
          xcode-project use-profiles

      # =====================================================
      # 8. Set App Name / Version / Build Number
      # =====================================================
      - name: Set Wafar version
        script: |
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName وفّر" \
            ios/Runner/Info.plist

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString 1.0.0" \
            ios/Runner/Info.plist

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion 2" \
            ios/Runner/Info.plist

      # =====================================================
      # 9. Build signed App Store IPA
      # =====================================================
      - name: Build iOS IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
