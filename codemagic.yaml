workflows:
  ios-workflow:
    name: Wafar iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Wafar Codemagic
    environment:
      flutter: "3.44.7"
      xcode: latest
      cocoapods: "1.16.2"
      vars:
        BUNDLE_ID: "com.wafar.user"
    scripts:
      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Deep Clean iOS Project
        script: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/Flutter.podspec
          find ios -name "Package.resolved" -type f -delete

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios && pod install

      - name: Build ipa for App Store
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_waiting_for_build_processing: true
