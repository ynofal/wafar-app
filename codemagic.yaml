workflows:
  ios-workflow:
    name: Wafar iOS
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.7
      xcode: latest
      cocoapods: 1.16.2
      groups:
        - ios-workflow   # مجموعة المتغيرات المربطوة في كودماجيك

    scripts:

      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Clean Flutter
        script: |
          flutter clean

      - name: Remove old iOS generated data
        script: |
          rm -rf ios/.symlinks
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock

      - name: Remove old Swift Package Manager data
        script: |
          find ios -name "Package.resolved" -type f -delete
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/org.swift.swiftpm

      - name: Set up GoogleService-Info.plist
        script: |
          echo $GOOGLE_SERVICE_INFO_PLIST | base64 --decode > ios/Runner/GoogleService-Info.plist
          cp ios/Runner/GoogleService-Info.plist ios/GoogleService-Info.plist

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files com.wafar.user --type APP_STORE || true

      - name: Build iOS IPA
        script: |
          flutter build ipa --release --no-codesign

    artifacts:
      - build/ios/ipa/*.ipa
