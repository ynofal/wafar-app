workflows:
  ios-workflow:
    name: Wafar iOS
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.7
      xcode: latest
      cocoapods: 1.16.2
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.wafar.user

    scripts:

      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Clean Flutter
        script: |
          flutter clean

      - name: Remove old iOS generated data
        script: |
          rm -rf ios/.symlinks
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock

      - name: Remove Swift Package Manager Caches
        script: |
          find ios -name "Package.resolved" -type f -delete
          rm -rf ios/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/
          rm -rf ios/Runner.xcodeproj/project.xcworkspace/xcuserdata/
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/org.swift.swiftpm

      - name: Generate GoogleService-Info.plist
        script: |
          cat << 'EOF' > ios/Runner/GoogleService-Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CLIENT_ID</key>
              <string>1:763294821639:ios:placeholder</string>
              <key>REVERSED_CLIENT_ID</key>
              <string>com.googleusercontent.apps.763294821639-placeholder</string>
              <key>API_KEY</key>
              <string>AIzaSyPlaceholderKeyForBuild000</string>
              <key>GCM_SENDER_ID</key>
              <string>763294821639</string>
              <key>PLIST_VERSION</key>
              <string>1</string>
              <key>BUNDLE_ID</key>
              <string>com.wafar.user</string>
              <key>PROJECT_ID</key>
              <string>wafar-app</string>
              <key>STORAGE_BUCKET</key>
              <string>wafar-app.appspot.com</string>
              <key>DATABASE_URL</key>
              <string>https://wafar-app-default-rtdb.firebaseio.com</string>
              <key>SENDER_ID</key>
              <string>763294821639</string>
              <key>APP_ID</key>
              <string>1:763294821639:ios:placeholder</string>
          </dict>
          </plist>
          EOF
          cp ios/Runner/GoogleService-Info.plist ios/GoogleService-Info.plist

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

      - name: Set up code signing settings
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
