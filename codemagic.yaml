workflows:
  ios-workflow:
    name: Wafar iOS
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.3
      xcode: 16.4
      cocoapods: default
      ios_signing:
        distribution_type: development
        bundle_identifier: com.wafar.user

    scripts:

      - name: Disable Swift Package Manager
        script: |
          echo "=== DISABLING SWIFT PACKAGE MANAGER ==="
          flutter config --no-enable-swift-package-manager
          flutter config

      - name: Clean Flutter and iOS
        script: |
          echo "=== CLEANING FLUTTER AND IOS ==="

          flutter clean

          rm -rf "$CM_BUILD_DIR/ios/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm"
          rm -rf "$CM_BUILD_DIR/ios/Runner.xcworkspace/xcshareddata/swiftpm"
          rm -rf "$CM_BUILD_DIR/ios/.symlinks"

          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          rm -rf "$HOME/Library/Developer/Xcode/SourcePackages"
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm"

      - name: Get Flutter dependencies
        script: |
          echo "=== FLUTTER PUB GET ==="
          flutter pub get

      - name: Install CocoaPods
        script: |
          echo "=== INSTALLING COCOAPODS ==="

          cd ios

          pod deintegrate || true
          rm -rf Pods
          rm -f Podfile.lock

          pod install --repo-update

      - name: Final Swift Package Manager cleanup
        script: |
          echo "=== FINAL SPM CLEANUP ==="

          rm -rf "$CM_BUILD_DIR/ios/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm"
          rm -rf "$CM_BUILD_DIR/ios/Runner.xcworkspace/xcshareddata/swiftpm"

          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          rm -rf "$HOME/Library/Developer/Xcode/SourcePackages"
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm"

      - name: Build iOS
        script: |
          echo "=== BUILDING WAFAR IOS ==="

          flutter build ipa \
            --debug \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - mkn400@gmail.com
        notify:
          success: true
          failure: true
