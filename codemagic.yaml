workflows:
  ios-workflow:
    name: Wafar iOS
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.3
      xcode: 16.4
      cocoapods: 1.16.2

    scripts:
      - name: Disable Swift Package Manager
        script: flutter config --no-enable-swift-package-manager

      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Clean Flutter project
        script: flutter clean

      - name: Build iOS
        script: flutter build ios --debug --no-codesign

    artifacts:
      - build/ios/Debug-iphoneos/*.app