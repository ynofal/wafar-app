workflows:
  ios-workflow:
    name: Wafar iOS
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.3
      xcode: 26.0
      cocoapods: default

      ios_signing:
        distribution_type: developmentscripts:
  - name: Flutter clean and dependencies
    script: |
      flutter clean
      flutter pub get

  - name: Remove iOS generated files and SwiftPM state
    script: |
      cd ios

      rm -rf Pods
      rm -rf .symlinks
      rm -rf Flutter/ephemeral

      rm -rf Runner.xcworkspace
      rm -rf Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm

      rm -rf ~/Library/Developer/Xcode/DerivedData/*
      rm -rf ~/Library/Developer/Xcode/SourcePackages
      rm -rf ~/Library/Caches/org.swift.swiftpm
      rm -rf ~/Library/org.swift.swiftpm

      cd ..

  - name: Install CocoaPods
    script: |
      cd ios
      pod deintegrate || true
      pod install --repo-update
      cd ..

  - name: Build iOS
    script: |
      flutter build ipa \
        --debug \
        --export-options-plist=/Users/builder/export_options.plist

artifacts:
  - build/ios/ipa/*.ipa
  - /tmp/xcodebuild_logs/*.log
        bundle_identifier: com.wafar.user

    scripts:
      - name: Flutter clean and pub get
        script: |
          flutter clean
          flutter pub get

      - name: Clean Xcode and Swift Package Manager caches
        script: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/SourcePackages
          rm -rf ios/Pods
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/ephemeral

      - name: Install CocoaPods
        script: |
          cd ios
          pod deintegrate || true
          pod install --repo-update
          cd ..

      - name: Build iOS IPA
        script: |
          flutter build ipa \
            --debug \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
