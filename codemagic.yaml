workflows:
  ios-workflow:
    name: Wafar iOS
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.3
      xcode: latest
      cocoapods: 1.16.2

    scripts:

      - name: Disable Swift Package Manager globally
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Clean Flutter environment
        script: |
          flutter clean

      - name: Remove old iOS caches and symlinks
        script: |
          rm -rf ios/.symlinks
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          find ios -name "Package.resolved" -type f -delete

      - name: Deep clean Xcode DerivedData and SPM Caches
        script: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ~/Library/Caches/org.swift.swiftpm/*
          rm -rf ~/Library/org.swift.swiftpm/*

      - name: Forcefully strip all SPM references from project file
        script: |
          python3 <<'PY'
          from pathlib import Path
          import re

          pbx = Path("ios/Runner.xcodeproj/project.pbxproj")
          if pbx.exists():
              text = pbx.read_text()
              
              # إزالة كافة أجزاء وكتل الـ SPM من الملف
              text = re.sub(r'/\* Begin XCSwiftPackageProductDependency section \*/.*?/\* End XCSwiftPackageProductDependency section \*/', '', text, flags=re.S)
              text = re.sub(r'/\* Begin XCRemoteSwiftPackageReference section \*/.*?/\* End XCRemoteSwiftPackageReference section \*/', '', text, flags=re.S)
              text = re.sub(r'/\* Begin PBXBuildFile section \*/(.*?)/\* End PBXBuildFile section \*/', lambda m: re.sub(r'.*SwiftPackage.*?\n', '', m.group(0)), text, flags=re.S)
              
              # تنظيف مراجع الـ packages داخل الـ project
              text = re.sub(r'\n\s*packageReferences\s*=\s*\(\s*\n.*?\n\s*\);\s*', '\n', text, flags=re.S)
              text = re.sub(r'\n\s*packageProductDependencies\s*=\s*\(\s*\n.*?\n\s*\);\s*', '\n', text, flags=re.S)
              
              pbx.write_text(text)
              print("Successfully purged all SPM references from project.pbxproj")
          PY

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update

      - name: Set up code signing profiles
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA release
        script: |
          flutter build ipa \
            --release \
            --export-options-plist /Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
