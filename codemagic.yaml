workflows:
  ios-workflow:
    name: Wafar iOS
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.3
      xcode: 16.4
      cocoapods: default

      ios_signing:
        distribution_type: development
        bundle_identifier: com.wafar.user

    scripts:

      - name: Disable Flutter Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager
          flutter config

      - name: Clean Swift Package Manager files
        script: |
          rm -rf ios/.swiftpm
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/org.swift.swiftpm
          rm -rf ~/.cache/org.swift.swiftpm

      - name: Flutter clean
        script: |
          flutter clean
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod deintegrate || true
          pod install --repo-update
          cd ..

      - name: Verify Swift Package Manager is disabled
        script: |
          flutter config

      - name: Build iOS IPA
        script: |
          flutter build ipa --debug

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - mkn400@gmail.com
        notify:
          success: true
          failure: true
