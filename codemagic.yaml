workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: "3.44.3"
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.wafar.user"
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type APP_STORE
    artifacts:
      - build/ios/ipa/*.ipa
