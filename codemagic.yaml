workflows:
  ios-workflow:
    name: Wafar iOS
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.3
      xcode: 26.0
      cocoapods: 1.16.2
    scripts:
      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Clean Flutter
        script: |
          flutter clean
      - name: Remove iOS generated files
        script: |
          rm -rf ios/.symlinks
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
      - name: Remove Xcode-level SPM resolved files
        script: |
          find ios -name "Package.resolved" -print -delete
          find ios -type d -name "swiftpm" -print -exec rm -rf {} +
      - name: Remove Xcode Swift Package Manager caches
        script: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/org.swift.swiftpm
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Resolve Swift Package Manager dependencies separately
        script: |
          cd ios
          for i in 1 2 3; do
            xcodebuild -resolvePackageDependencies \
              -project Runner.xcodeproj \
              -scheme Runner && break
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
      - name: Build iOS
        script: |
          flutter build ipa --release --export-options-plist /Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
