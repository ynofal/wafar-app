workflows:
  ios-workflow:
    name: Wafar iOS
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.3
      xcode: 16.4
      cocoapods: default
      ios_signing:
        distribution_type: development
        bundle_identifier: com.wafar.user

    scripts:

      - name: Clean old Swift Package Manager data
        script: |
          echo "=== CLEANING OLD SPM DATA ==="

          rm -rf "$CM_BUILD_DIR/ios/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm"
          rm -rf "$CM_BUILD_DIR/ios/Runner.xcworkspace/xcshareddata/swiftpm"

          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm"
          rm -rf "$HOME/Library/Developer/Xcode/SourcePackages"

          echo "SPM cache cleaned."

      - name: Flutter clean
        script: |
          flutter clean

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod deintegrate || true
          rm -rf Pods
          rm -f Podfile.lock
          pod install --repo-update

      - name: Clean Xcode build data
        script: |
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          rm -rf "$HOME/Library/Developer/Xcode/Archives"

      - name: Build iOS
        script: |
          flutter build ipa \
            --debug \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - mkn400@gmail.com
        notify:
          success: true
          failure: true
