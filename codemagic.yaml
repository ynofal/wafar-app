workflows:
  ios-workflow:
    name: Wafar iOS
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.3
      xcode: 26.0
      cocoapods: 1.16.2

    scripts:

      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Clean Flutter
        script: |
          flutter clean

      - name: Remove iOS generated files
        script: |
          rm -rf ios/.symlinks
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/Flutter/ephemeral

      - name: Remove all Swift Package Manager files
        script: |
          echo "=== Removing SPM files ==="

          find ios -name "Package.resolved" -type f -print -delete
          find ios -type d -name "swiftpm" -print -prune -exec rm -rf {} +
          find ios -type d -name "SourcePackages" -print -prune -exec rm -rf {} +

          echo "=== SPM files removed ==="

      - name: Inspect Xcode project for SPM
        script: |
          echo "======================================"
          echo "SEARCHING PROJECT FOR SPM REFERENCES"
          echo "======================================"

          echo "--- XCRemoteSwiftPackageReference ---"
          grep -Rni "XCRemoteSwiftPackageReference" ios || true

          echo "--- XCSwiftPackageProductDependency ---"
          grep -Rni "XCSwiftPackageProductDependency" ios || true

          echo "--- packageReferences ---"
          grep -Rni "packageReferences" ios || true

          echo "--- packageProductDependencies ---"
          grep -Rni "packageProductDependencies" ios || true

          echo "--- Package.swift ---"
          find ios -name "Package.swift" -print || true

          echo "--- Package.resolved ---"
          find ios -name "Package.resolved" -print || true

      - name: Remove manual SPM references from Xcode project
        script: |
          python3 <<'PY'
          from pathlib import Path

          pbx = Path("ios/Runner.xcodeproj/project.pbxproj")

          if not pbx.exists():
              print("ERROR: ios/Runner.xcodeproj/project.pbxproj does not exist")
              raise SystemExit(1)

          text = pbx.read_text()

          print("Original project size:", len(text))

          # Remove the complete XCRemoteSwiftPackageReference section.
          markers = [
              "XCRemoteSwiftPackageReference",
              "XCSwiftPackageProductDependency",
          ]

          for marker in markers:
              if marker in text:
                  print("FOUND:", marker)
              else:
                  print("NOT FOUND:", marker)

          # Remove packageReferences arrays.
          lines = text.splitlines(True)
          output = []
          skip = False
          depth = 0

          for line in lines:
              stripped = line.strip()

              if not skip and stripped.startswith("packageReferences = ("):
                  print("Removing packageReferences block")
                  skip = True
                  depth = 1
                  continue

              if not skip and stripped.startswith("packageProductDependencies = ("):
                  print("Removing packageProductDependencies block")
                  skip = True
                  depth = 1
                  continue

              if skip:
                  depth += line.count("(")
                  depth -= line.count(")")
                  if depth <= 0:
                      skip = False
                  continue

              output.append(line)

          text = "".join(output)

          pbx.write_text(text)

          print("Final project size:", len(text))
          print("Project cleanup completed.")
          PY

      - name: Verify project is free of manual SPM
        script: |
          echo "======================================"
          echo "FINAL SPM CHECK"
          echo "======================================"

          if grep -Rni "XCRemoteSwiftPackageReference" ios/Runner.xcodeproj; then
            echo "ERROR: XCRemoteSwiftPackageReference still exists"
            exit 1
          fi

          if grep -Rni "XCSwiftPackageProductDependency" ios/Runner.xcodeproj; then
            echo "ERROR: XCSwiftPackageProductDependency still exists"
            exit 1
          fi

          echo "SUCCESS: No manual SPM references found in Runner.xcodeproj"

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS
        script: |
          flutter build ipa \
            --release \
            --export-options-plist /Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
