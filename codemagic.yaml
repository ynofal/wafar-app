workflows:
  ios-workflow:
    name: Wafar iOS
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      flutter: 3.44.3
      xcode: 16.1          # <-- ثبّت فرشن مش "latest"، لأن latest بيجيب 16.2+ اللي فيها الباج ده
      cocoapods: 1.16.2
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.wafar.user
    scripts:
      - name: Clean Everything and Nuke SPM Caches
        script: |
          flutter clean
          rm -rf ios/.symlinks
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/Runner.xcworkspace
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ~/Library/Caches/org.swift.swiftpm/*
          rm -rf ~/Library/org.swift.swiftpm/*
          rm -rf ios/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          find ios -name "Package.resolved" -type f -delete
      # لاحظ: خطوة "Strip Swift Package References" اتشالت خالص من هنا
      - name: Create GoogleService-Info.plist
        script: |
          cat << 'EOF' > ios/Runner/GoogleService-Info.plist
          ... (نفس المحتوى اللي عندك)
          EOF
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods and Recreate Workspace
        script: |
          cd ios
          pod install --repo-update
      - name: Set up code signing profiles
        script: |
          xcode-project use-profiles
      - name: Build iOS IPA release
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
