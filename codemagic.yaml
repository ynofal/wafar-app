workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.wafar.user
      vars:
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Clean SPM and DerivedData caches
        script: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf $CM_BUILD_DIR/ios/.symlinks
          rm -rf $CM_BUILD_DIR/ios/Pods
          rm -rf $CM_BUILD_DIR/ios/Podfile.lock

      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -maxdepth 2 -execdir pod install \;

      - name: Resolve Swift Package Manager dependencies with retry
        script: |
          cd ios
          xcodebuild -resolvePackageDependencies \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
          || (echo "First attempt failed, clearing cache and retrying..." \
              && rm -rf ~/Library/Caches/org.swift.swiftpm \
              && rm -rf ~/Library/org.swift.swiftpm \
              && xcodebuild -resolvePackageDependencies \
                   -workspace "$XCODE_WORKSPACE" \
                   -scheme "$XCODE_SCHEME")

      - name: Flutter build ipa (with retry for Xcode SPM crash)
        script: |
          xcode-project use-profiles

          MAX_ATTEMPTS=3
          ATTEMPT=1
          until flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
          do
            if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
              echo "flutter build ipa failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            echo "Build attempt $ATTEMPT failed (likely Xcode SPM resolution crash). Clearing caches and retrying..."
            rm -rf ~/Library/Caches/org.swift.swiftpm
            rm -rf ~/Library/org.swift.swiftpm
            rm -rf ~/Library/Developer/Xcode/DerivedData
            rm -rf ios/.symlinks
            ATTEMPT=$((ATTEMPT+1))
            xcode-project use-profiles
          done

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
