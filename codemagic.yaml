workflows:
  ios-workflow:
    name: Wafar iOS
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.7
      xcode: 16.4
      cocoapods: 1.16.2

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.wafar.user

    scripts:

      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Clean Flutter
        script: |
          flutter clean

      - name: Remove old iOS generated data
        script: |
          rm -rf ios/.symlinks
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock

      - name: Remove old Swift Package Manager data
        script: |
          find ios -name "Package.resolved" -type f -delete
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/org.swift.swiftpm

      - name: Remove Swift Package references from Xcode project
        script: |
          python3 <<'PY'
          import re
          from pathlib import Path

          p = Path("ios/Runner.xcodeproj/project.pbxproj")
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'/\* Begin XCRemoteSwiftPackageReference section \*/.*?/\* End XCRemoteSwiftPackageReference section \*/',
              '',
              s,
              flags=re.S
          )

          s = re.sub(
              r'/\* Begin XCSwiftPackageProductDependency section \*/.*?/\* End XCSwiftPackageProductDependency section \*/',
              '',
              s,
              flags=re.S
          )

          p.write_text(s, encoding="utf-8")

          print("Swift Package references removed")
          PY

      - name: Generate GoogleService-Info.plist
        script: |
          cat << 'EOF' > ios/Runner/GoogleService-Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CLIENT_ID</key>
              <string>dummy_client_id</string>
              <key>REVERSED_CLIENT_ID</key>
              <string>dummy_reversed_client_id</string>
              <key>API_KEY</key>
              <string>dummy_api_key</string>
              <key>GCM_SENDER_ID</key>
              <string>dummy_gcm_sender_id</string>
              <key>PLIST_VERSION</key>
              <string>1</string>
              <key>BUNDLE_ID</key>
              <string>com.wafar.user</string>
              <key>PROJECT_ID</key>
              <string>wafar-app</string>
              <key>STORAGE_BUCKET</key>
              <string>wafar-app.appspot.com</string>
              <key>IS_ADS_ENABLED</key>
              <false/>
              <key>IS_ANALYTICS_ENABLED</key>
              <false/>
              <key>IS_APPINVITE_ENABLED</key>
              <true/>
              <key>IS_GCM_ENABLED</key>
              <true/>
              <key>IS_SIGNIN_ENABLED</key>
              <true/>
              <key>GOOGLE_APP_ID</key>
              <string>dummy_google_app_id</string>
          </dict>
          </plist>
          EOF

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build signed iOS IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
