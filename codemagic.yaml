workflows:
  ios-workflow:
    name: Wafar iOS
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.3
      xcode: latest
      cocoapods: 1.16.2

    scripts:
      - name: Disable Swift Package Manager globally
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Clean Flutter environment
        script: |
          flutter clean

      - name: Remove old iOS caches and symlinks
        script: |
          rm -rf ios/.symlinks
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          find ios -name "Package.resolved" -type f -delete

      - name: Deep clean Xcode DerivedData, SPM Caches and Workspace Data
        script: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ~/Library/Caches/org.swift.swiftpm/*
          rm -rf ~/Library/org.swift.swiftpm/*
          rm -rf ios/Runner.xcworkspace/xcshareddata/swiftpm
          rm -rf ios/Runner.xcworkspace/xcuserdata

      - name: Purge all package references and workspace data from Xcode project
        script: |
          python3 <<'PY'
          import os
          from pathlib import Path
          import shutil

          pbxproj_path = Path("ios/Runner.xcodeproj/project.pbxproj")
          if pbxproj_path.exists():
              content = pbxproj_path.read_text(encoding="utf-8")
              lines = content.splitlines()
              new_lines = []
              skip = False
              for line in lines:
                  if "XCSwiftPackageProductDependency" in line or "XCRemoteSwiftPackageReference" in line or "SwiftPackage" in line:
                      skip = True
                  if skip and "/* End" in line:
                      skip = False
                      continue
                  if not skip:
                      new_lines.append(line)
                      
              pbxproj_path.write_text("\n".join(new_lines), encoding="utf-8")
              print("Successfully purged all SPM references from project.pbxproj.")
          PY

      - name: Create GoogleService-Info.plist
        script: |
          cat << 'EOF' > ios/Runner/GoogleService-Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CLIENT_ID</key>
              <string>dummy_client_id</string>
              <key>REVERSED_CLIENT_ID</key>
              <string>dummy_reversed_client_id</string>
              <key>API_KEY</key>
              <string>dummy_api_key</string>
              <key>GCM_SENDER_ID</key>
              <string>dummy_gcm_sender_id</string>
              <key>PLIST_VERSION</key>
              <string>1</string>
              <key>BUNDLE_ID</key>
              <string>com.wafar.user</string>
              <key>PROJECT_ID</key>
              <string>wafar-app</string>
              <key>STORAGE_BUCKET</key>
              <string>wafar-app.appspot.com</string>
              <key>IS_ADS_ENABLED</key>
              <false></false>
              <key>IS_ANALYTICS_ENABLED</key>
              <false></false>
              <key>IS_APPINVITE_ENABLED</key>
              <true></true>
              <key>IS_GCM_ENABLED</key>
              <true></true>
              <key>IS_SIGNIN_ENABLED</key>
              <true></true>
              <key>GOOGLE_APP_ID</key>
              <string>dummy_google_app_id</string>
          </dict>
          </plist>
          EOF

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update

      - name: Set up code signing profiles
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA release
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
