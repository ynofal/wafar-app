workflows:
  ios-workflow:
    name: Wafar iOS
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.3
      xcode: latest
      cocoapods: 1.16.2

    scripts:

      - name: Disable Swift Package Manager globally
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Clean Flutter environment
        script: |
          flutter clean

      - name: Remove old iOS caches and symlinks
        script: |
          rm -rf ios/.symlinks
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          find ios -name "Package.resolved" -type f -delete

      - name: Deep clean Xcode DerivedData and SPM Caches
        script: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ~/Library/Caches/org.swift.swiftpm/*
          rm -rf ~/Library/org.swift.swiftpm/*

      - name: Purge all package references and workspace data from Xcode project
        script: |
          python3 <<'PY'
          import os
          from pathlib import Path
          import shutil

          # حذف مجلدات الـ workspace القديمة اللي بتخزن الكاش التالف
          xcworkspace = Path("ios/Runner.xcworkspace")
          if xcworkspace.exists():
              swiftpm_data = xcworkspace / "xcuserdata"
              if swiftpm_data.exists():
                  shutil.rmtree(swiftpm_data)

          pbxproj_path = Path("ios/Runner.xcodeproj/project.pbxproj")
          if pbxproj_path.exists():
              content = pbxproj_path.read_text(encoding="utf-8")
              
              # تنظيف الأسطر والملفات المرتبطة بالـ Swift Packages اليدوية من ملف المشروع
              lines = content.splitlines()
              new_lines = []
              skip = False
              for line in lines:
                  if "XCSwiftPackageProductDependency" in line or "XCRemoteSwiftPackageReference" in line:
                      skip = True
                  if skip and "/\* End" in line:
                      skip = False
                      continue
                  if not skip and "SwiftPackage" not in line:
                      new_lines.append(line)
                      
              pbxproj_path.write_text("\n".join(new_lines), encoding="utf-8")
              print("Successfully sanitized project.pbxproj from SPM references.")
          PY

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update

      - name: Set up code signing profiles
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA release
        script: |
          flutter build ipa \
            --release \
            --export-options-plist /Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
