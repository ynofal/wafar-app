workflows:
  ios-workflow:
    name: Wafar iOS
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.3
      xcode: latest
      cocoapods: 1.16.2

    scripts:
      - name: Clean Flutter environment
        script: |
          flutter clean

      - name: Remove old iOS caches and Pods
        script: |
          rm -rf ios/.symlinks
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock

      - name: Deep clean Xcode DerivedData
        script: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: Create GoogleService-Info.plist
        script: |
          cat << 'EOF' > ios/Runner/GoogleService-Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CLIENT_ID</key>
              <string>dummy_client_id</string>
              <key>REVERSED_CLIENT_ID</key>
              <string>dummy_reversed_client_id</string>
              <key>API_KEY</key>
              <string>dummy_api_key</string>
              <key>GCM_SENDER_ID</key>
              <string>dummy_gcm_sender_id</string>
              <key>PLIST_VERSION</key>
              <string>1</string>
              <key>BUNDLE_ID</key>
              <string>com.wafar.user</string>
              <key>PROJECT_ID</key>
              <string>wafar-app</string>
              <key>STORAGE_BUCKET</key>
              <string>wafar-app.appspot.com</string>
              <key>IS_ADS_ENABLED</key>
              <false></false>
              <key>IS_ANALYTICS_ENABLED</key>
              <false></false>
              <key>IS_APPINVITE_ENABLED</key>
              <true></true>
              <key>IS_GCM_ENABLED</key>
              <true></true>
              <key>IS_SIGNIN_ENABLED</key>
              <true></true>
              <key>GOOGLE_APP_ID</key>
              <string>dummy_google_app_id</string>
          </dict>
          </plist>
          EOF

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update

      - name: Set up code signing profiles
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA release
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
