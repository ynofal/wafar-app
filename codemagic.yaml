workflows:
  ios-workflow:
    name: Wafar iOS
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.7
      xcode: 26.0
      cocoapods: 1.16.2
      # اربط الـ App Store Connect API Key هنا لو مش متعرّف في المتغيرات
      # 

    scripts:

      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Clean Flutter
        script: |
          flutter clean

      - name: Remove old iOS generated data
        script: |
          rm -rf ios/.symlinks
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock

      - name: Remove old Swift Package Manager data
        script: |
          find ios -name "Package.resolved" -type f -delete
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/org.swift.swiftpm

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

      - name: Set up code signing
        script: |
          # السطر ده بيخلي كودماجيك ينشئ البروفايل ويعمل التوقيع أوتوماتيك باستخدام الـ API Key اللي في إعدادات التطبيق
          app-store-connect fetch-signing-files com.wafar.user

      - name: Build iOS
        script: |
          flutter build ipa \
            --release \
            --export-options-plist /Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
