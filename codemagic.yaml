workflows:
  ios-workflow:
    name: iOS Workflow
    environment:
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: "com.wafar.user"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    scripts:
      - name: Set up code signing settings
        script: |
          xcode-project use-profiles
      - name: Build ipa for App Store
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME" --release --allowProvisioningUpdates
