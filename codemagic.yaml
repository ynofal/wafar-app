workflows:
  ios-workflow:
    name: Wafar iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Wafar Codemagic
    environment:
      flutter: "3.44.7"
      xcode: latest
      cocoapods: "1.16.2"
      vars:
        BUNDLE_ID: "com.wafar.user"
        COMPILER_INDEX_STORE_ENABLE: "NO"
    scripts:
      - name: Disable Swift Package Manager globally
        script: |
          flutter config --no-enable-swift-package-manager
          defaults write com.apple.dt.Xcode IDESkipPackagePluginValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroValidation -bool YES

      - name: Deep Clean Project
        script: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/.symlinks
          find ios -name "Package.resolved" -type f -delete

      - name: Ensure GoogleService-Info.plist is in place
        script: |
          mkdir -p ios/Runner
          cat << 'EOF' > ios/Runner/GoogleService-Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>API_KEY</key>
              <string>AIzaSyDyKV_vH04kjoCZHaVpXOI1AA-KEDr405Y</string>
              <key>GCM_SENDER_ID</key>
              <string>730828848463</string>
              <key>PLIST_VERSION</key>
              <string>1</string>
              <key>BUNDLE_ID</key>
              <string>com.wafar.user</string>
              <key>PROJECT_ID</key>
              <string>wafar-ccf7b</string>
              <key>STORAGE_BUCKET</key>
              <string>wafar-ccf7b.firebasestorage.app</string>
              <key>IS_ADS_ENABLED</key>
              <false></false>
              <key>IS_ANALYTICS_ENABLED</key>
              <false></false>
              <key>IS_APPINVITE_ENABLED</key>
              <true></true>
              <key>IS_GCM_ENABLED</key>
              <true></true>
              <key>IS_SIGNIN_ENABLED</key>
              <true></true>
              <key>GOOGLE_APP_ID</key>
              <string>1:730828848463:ios:3761c4afa6e87da5f5593a</string>
          </dict>
          </plist>
          EOF
          cp ios/Runner/GoogleService-Info.plist ios/GoogleService-Info.plist

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios && pod install

      - name: Set up code signing
        script: |
          xcode-project use-profiles --automatic

      - name: Build ipa for App Store
        script: |
          xcode-project build-ipa --workspace ios/Runner.xcworkspace --scheme Runner

    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
